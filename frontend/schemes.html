<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmProfit - Government Schemes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}
        .sidebar{width:260px;background:#1e3c2c;color:white;min-height:100vh;position:fixed;left:0;top:0;padding:20px;}
        .sidebar-header{text-align:center;padding-bottom:20px;border-bottom:2px solid #2ecc71;margin-bottom:20px;}
        .sidebar .nav-link{color:white;padding:12px 15px;margin:5px 0;border-radius:10px;text-decoration:none;display:block;}
        .sidebar .nav-link:hover{background:#2ecc71;}
        .sidebar .nav-link i{margin-right:10px;}
        .main-content{margin-left:260px;padding:20px;}
        .top-navbar{background:white;padding:15px 20px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
        .scheme-card{background:white;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
        .scheme-icon{width:50px;height:50px;background:#2ecc71;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:15px;}
        .scheme-icon i{font-size:24px;color:white;}
        .search-box{width:300px;padding:10px;border-radius:25px;border:1px solid #ddd;}
        .btn-logout{background:#e74c3c;color:white;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;}
        .loading{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:10px;z-index:9999;}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><h3><i class="fas fa-leaf"></i> FarmProfit</h3></div>
        <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a class="nav-link" href="crops.html"><i class="fas fa-seedling"></i> Crops</a>
        <a class="nav-link" href="expenses.html"><i class="fas fa-money-bill-wave"></i> Expenses</a>
        <a class="nav-link" href="profit.html"><i class="fas fa-chart-line"></i> Profit</a>
        <a class="nav-link active" href="schemes.html"><i class="fas fa-hand-holding-usd"></i> Schemes</a>
        <a class="nav-link" href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
        <a class="nav-link" href="ai-assistant.html"><i class="fas fa-robot"></i> AI Assistant</a>
        <a class="nav-link" href="chatbot.html"><i class="fas fa-comment-dots"></i> Chatbot</a>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <span id="userName"></span>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4"><h2>Government Schemes for Farmers</h2><input type="text" id="searchBox" class="search-box" placeholder="Search schemes..."></div>
            <div id="schemesList"></div>
        </div>
    </div>
    <div id="loading" class="loading"><div class="spinner-border text-success"></div></div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';
        
        function showLoading() { document.getElementById('loading').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading').style.display = 'none'; }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        
        async function loadSchemes(keyword = '') {
            showLoading();
            try {
                let url = '/schemes';
                if (keyword) url += `/search?keyword=${keyword}`;
                const response = await fetch(`${API_URL}${url}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const schemes = await response.json();
                document.getElementById('schemesList').innerHTML = schemes.map(s => `
                    <div class="scheme-card"><div class="scheme-icon"><i class="fas fa-hand-holding-usd"></i></div>
                    <h4>${s.schemeName}</h4><p>${s.description || 'No description available'}</p>
                    <div class="mt-2"><strong>Eligibility:</strong> ${s.eligibility || 'All farmers'}</div>
                    <div><strong>Benefits:</strong> ${s.benefits || 'Financial assistance available'}</div>
                    ${s.applyUrl ? `<a href="${s.applyUrl}" target="_blank" class="btn btn-sm btn-success mt-3">Apply Now</a>` : ''}</div>
                `).join('');
            } catch(e) { console.error(e); } finally { hideLoading(); }
        }
        
        document.getElementById('searchBox').addEventListener('input', (e) => loadSchemes(e.target.value));
        document.getElementById('userName').innerHTML = `<i class="fas fa-user-circle"></i> Welcome, ${localStorage.getItem('userName') || 'Farmer'}`;
        loadSchemes();
    </script>
</body>
</html>
