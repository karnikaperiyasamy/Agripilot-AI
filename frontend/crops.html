<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmProfit - Crops</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}
        .sidebar{width:260px;background:#1e3c2c;color:white;min-height:100vh;position:fixed;left:0;top:0;padding:20px;}
        .sidebar-header{text-align:center;padding-bottom:20px;border-bottom:2px solid #2ecc71;margin-bottom:20px;}
        .sidebar .nav-link{color:white;padding:12px 15px;margin:5px 0;border-radius:10px;text-decoration:none;display:block;}
        .sidebar .nav-link:hover{background:#2ecc71;}
        .sidebar .nav-link i{margin-right:10px;}
        .main-content{margin-left:260px;padding:20px;}
        .top-navbar{background:white;padding:15px 20px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
        .table-container{background:white;border-radius:15px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
        .btn-success{background:#2ecc71;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;color:white;}
        .btn-sm{padding:5px 10px;margin:0 3px;}
        .btn-warning{background:#f39c12;border:none;color:white;}
        .btn-danger{background:#e74c3c;border:none;color:white;}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;}
        .modal.show{display:block;}
        .modal-dialog{margin:50px auto;width:90%;max-width:500px;}
        .modal-content{background:white;border-radius:10px;}
        .modal-header{padding:15px;background:#2ecc71;color:white;border-radius:10px 10px 0 0;}
        .modal-body{padding:20px;}
        .form-control{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px;}
        .loading{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:10px;z-index:9999;}
        .btn-logout{background:#e74c3c;color:white;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><h3><i class="fas fa-leaf"></i> FarmProfit</h3></div>
        <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a class="nav-link active" href="crops.html"><i class="fas fa-seedling"></i> Crops</a>
        <a class="nav-link" href="expenses.html"><i class="fas fa-money-bill-wave"></i> Expenses</a>
        <a class="nav-link" href="profit.html"><i class="fas fa-chart-line"></i> Profit</a>
        <a class="nav-link" href="schemes.html"><i class="fas fa-hand-holding-usd"></i> Schemes</a>
        <a class="nav-link" href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
        <a class="nav-link" href="ai-assistant.html"><i class="fas fa-robot"></i> AI Assistant</a>
        <a class="nav-link" href="chatbot.html"><i class="fas fa-comment-dots"></i> Chatbot</a>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <span id="userName"></span>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4"><h2>Crop Management</h2><button class="btn-success" onclick="showAddCropModal()"><i class="fas fa-plus"></i> Add Crop</button></div>
            <div class="table-container"><div class="table-responsive"><table class="table"><thead><tr><th>Crop Name</th><th>Area (Acres)</th><th>Season</th><th>Expected Yield</th><th>Status</th><th>Actions</th></tr></thead><tbody id="cropsList"></tbody></table></div></div>
        </div>
    </div>

    <!-- Add Crop Modal -->
    <div id="addCropModal" class="modal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Add New Crop</h5><button onclick="closeAddModal()" style="background:none;border:none;color:white;font-size:20px;">&times;</button></div><div class="modal-body"><input type="text" id="cropName" class="form-control" placeholder="Crop Name"><input type="number" id="area" class="form-control" placeholder="Area (Acres)"><select id="season" class="form-control"><option>Kharif</option><option>Rabi</option><option>Summer</option></select><input type="number" id="expectedYield" class="form-control" placeholder="Expected Yield (Quintals)"><button class="btn-success" style="width:100%;margin-top:10px;" onclick="addCrop()">Save Crop</button></div></div></div></div>

    <div id="loading" class="loading"><div class="spinner-border text-success"></div></div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';
        
        function showLoading() { document.getElementById('loading').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading').style.display = 'none'; }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        
        async function apiCall(endpoint, method = 'GET', data = null) {
            const options = { method, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(`${API_URL}${endpoint}`, options);
            if (response.status === 401) logout();
            return response.json();
        }
        
        function showAddCropModal() { document.getElementById('addCropModal').style.display = 'block'; }
        function closeAddModal() { document.getElementById('addCropModal').style.display = 'none'; }
        
        async function addCrop() {
            const cropData = { cropName: document.getElementById('cropName').value, area: parseFloat(document.getElementById('area').value), season: document.getElementById('season').value, expectedYield: parseFloat(document.getElementById('expectedYield').value), status: 'ACTIVE' };
            if (!cropData.cropName || !cropData.area) { alert('Please fill required fields'); return; }
            showLoading();
            try {
                const result = await apiCall('/farmer/crops', 'POST', cropData);
                if (result.success) { alert('Crop added successfully!'); closeAddModal(); loadCrops(); }
                else alert(result.message || ' Please Wait');
            } catch(e) { alert('Error adding crop'); } finally { hideLoading(); }
        }
        
        async function loadCrops() {
            showLoading();
            try {
                const crops = await apiCall('/farmer/crops');
                document.getElementById('cropsList').innerHTML = crops.map(c => `<tr><td>${c.cropName}</td><td>${c.area}</td><td>${c.season}</td><td>${c.expectedYield || '-'}</td><td><span class="badge bg-success">${c.status}</span></td><td><button class="btn-sm btn-danger" onclick="deleteCrop(${c.id})"><i class="fas fa-trash"></i></button></td></tr>`).join('');
            } catch(e) { console.error(e); } finally { hideLoading(); }
        }
        
        async function deleteCrop(id) {
            if (!confirm('Delete this crop?')) return;
            showLoading();
            try {
                const result = await apiCall(`/farmer/crops/${id}`, 'DELETE');
                if (result.success) { alert('Crop deleted'); loadCrops(); }
                else alert('Failed to delete');
            } catch(e) { alert('Error deleting'); } finally { hideLoading(); }
        }
        
        document.getElementById('userName').innerHTML = `<i class="fas fa-user-circle"></i> Welcome, ${localStorage.getItem('userName') || 'Farmer'}`;
        loadCrops();
    </script>
</body>
</html>
