<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmProfit - AI Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;}
        .sidebar{width:260px;background:#1e3c2c;color:white;min-height:100vh;position:fixed;left:0;top:0;padding:20px;}
        .sidebar-header{text-align:center;padding-bottom:20px;border-bottom:2px solid #2ecc71;margin-bottom:20px;}
        .sidebar .nav-link{color:white;padding:12px 15px;margin:5px 0;border-radius:10px;text-decoration:none;display:block;}
        .sidebar .nav-link:hover{background:#2ecc71;}
        .sidebar .nav-link i{margin-right:10px;}
        .main-content{margin-left:260px;padding:20px;}
        .top-navbar{background:white;padding:15px 20px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
        .chat-container{background:white;border-radius:15px;height:500px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
        .chat-messages{flex:1;overflow-y:auto;padding:20px;}
        .chat-message{margin-bottom:15px;display:flex;}
        .chat-message.user{justify-content:flex-end;}
        .chat-message.bot{justify-content:flex-start;}
        .message-bubble{max-width:70%;padding:10px 15px;border-radius:18px;}
        .user .message-bubble{background:#2ecc71;color:white;}
        .bot .message-bubble{background:#f1f1f1;color:#333;}
        .chat-input{padding:15px;border-top:1px solid #ddd;display:flex;gap:10px;}
        .chat-input input{flex:1;padding:10px;border:1px solid #ddd;border-radius:25px;outline:none;}
        .chat-input button{padding:10px 20px;background:#2ecc71;color:white;border:none;border-radius:25px;cursor:pointer;}
        .btn-logout{background:#e74c3c;color:white;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;}
        .loading{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:10px;z-index:9999;}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><h3><i class="fas fa-leaf"></i> FarmProfit</h3></div>
        <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a class="nav-link" href="crops.html"><i class="fas fa-seedling"></i> Crops</a>
        <a class="nav-link" href="expenses.html"><i class="fas fa-money-bill-wave"></i> Expenses</a>
        <a class="nav-link" href="profit.html"><i class="fas fa-chart-line"></i> Profit</a>
        <a class="nav-link" href="schemes.html"><i class="fas fa-hand-holding-usd"></i> Schemes</a>
        <a class="nav-link" href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
        <a class="nav-link" href="ai-assistant.html"><i class="fas fa-robot"></i> AI Assistant</a>
        <a class="nav-link active" href="chatbot.html"><i class="fas fa-comment-dots"></i> Chatbot</a>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <span id="userName"></span>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="container-fluid"><h2 class="mb-4">AI Farming Assistant</h2>
            <div class="chat-container"><div class="chat-messages" id="chatMessages"><div class="chat-message bot"><div class="message-bubble">Hello! I'm your AI Farming Assistant. Ask me about crops, fertilizers, irrigation, disease control, or government schemes!</div></div></div>
            <div class="chat-input"><input type="text" id="chatInput" placeholder="Type your farming question..." onkeypress="if(event.key==='Enter') sendMessage()"><button onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button></div></div>
        </div>
    </div>
    <div id="loading" class="loading"><div class="spinner-border text-success"></div></div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';
        
        function showLoading() { document.getElementById('loading').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading').style.display = 'none'; }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        
        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}`;
            messageDiv.innerHTML = `<div class="message-bubble">${text}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            input.value = '';
            showLoading();
            try {
                const response = await fetch(`${API_URL}/ai/chat`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                addMessage(data.reply || "I'm here to help with your farming questions!", 'bot');
            } catch(e) { addMessage('Sorry, I had trouble responding. Please try again.', 'bot'); } finally { hideLoading(); }
        }
        
        document.getElementById('userName').innerHTML = `<i class="fas fa-user-circle"></i> Welcome, ${localStorage.getItem('userName') || 'Farmer'}`;
    </script>
</body>
</html>
